<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Beauty We Walked Past</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{/* change --acc / --acc2 here to the official KMUTT orange */--bg:#FFFFFF;--card:#FFFFFF;--ink:#2A2522;--mute:#8A7B70;--line:#FFD9BF;--acc:#D95F0E;--acc2:#F58A2E;--bad:#B4533A;--sky:#FFF1E3;--grass:#F9D3A8;--road:#E8B98A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1511;--card:#251D17;--ink:#F6EBE2;--mute:#B79F8C;--line:#4A3626;--acc:#FF8A3D;--acc2:#FFB067;--sky:#3A2A1E;--grass:#5A4128;--road:#6F5236}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;line-height:2;letter-spacing:.02em;font-size:17px}
main{max-width:520px;margin:0 auto;padding:26px 22px 70px}
.steps{display:flex;gap:8px;margin-bottom:26px}
.steps i{flex:1;height:8px;border-radius:8px;background:var(--line)}
.steps i.on{background:var(--acc2)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:26px 22px}
h1{font-size:24px;line-height:1.6;margin:0 0 14px}
h2{font-size:20px;line-height:1.6;margin:0 0 10px}
p{margin:0 0 20px}
.mute{color:var(--mute);font-size:15px}
.stage{position:relative;height:190px;border-radius:16px;overflow:hidden;background:var(--sky);margin:18px 0}
.ground{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--grass)}
.road{position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--road)}
.obj{position:absolute;bottom:40px;font-size:46px;line-height:1;cursor:pointer;transform:translateX(-50%)}
.obj.done{opacity:.5}
.glow{animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.2)}}
#walker{position:absolute;bottom:22px;left:6%;transition:left .65s ease;transform:translateX(-50%);line-height:0}
.btn{display:block;width:100%;font:inherit;line-height:1.8;color:#fff;background:var(--acc);border:0;border-radius:14px;padding:14px 18px;cursor:pointer;margin-top:14px;text-align:left}
.btn.c{text-align:center;font-weight:600}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:14px}
.lay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-around;padding-bottom:36px;font-size:34px;pointer-events:none}
.slw{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.slw b{font-size:24px;cursor:pointer;background:var(--bg);border:2px solid var(--line);border-radius:12px;width:46px;height:46px;display:grid;place-items:center;user-select:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:18px;border-radius:18px;background:linear-gradient(90deg,#FFC48A,var(--acc));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:46px;border-radius:50%;background:#fff;border:5px solid var(--acc);box-shadow:0 3px 10px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;border:5px solid var(--acc)}
.hint{text-align:center;font-weight:600;color:var(--acc);animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:translateX(8px)}}
.hint.off{display:none}
.era{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.meter{margin:12px 0;font-size:15px}
.bar{height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:50%;background:var(--acc2);transition:width .6s}
.gq{display:flex;gap:12px;align-items:center;margin:14px 0}
.bub2{flex:1;background:var(--sky);border:2px solid var(--ink);border-radius:18px;padding:10px 14px;line-height:1.7;min-height:72px}
.big2{font-size:56px;line-height:1}
.fl{position:absolute;font-size:46px;cursor:pointer;animation:fl 3s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-14px)}}
.fl.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.ov{position:fixed;inset:0;background:rgba(30,16,6,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;overflow:auto}
.pop{width:100%;max-width:420px;text-align:center}
.bub{position:relative;background:#fff;color:#2A2522;border:3px solid #2A2522;border-radius:24px;padding:16px 20px;text-align:left;margin-bottom:26px;min-height:120px;animation:pop .35s}
.pop.gt .bub:after{left:calc(50% + 20px)}
.bub:after{content:"";position:absolute;bottom:-17px;left:50%;margin-left:-14px;border:14px solid transparent;border-top-color:#2A2522;border-bottom:0}
.bub b{color:#D95F0E;display:block;font-size:15px}
.bub div{white-space:pre-line}
.big{font-size:110px;line-height:1.1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.big.hop{animation:pop .6s cubic-bezier(.2,1.6,.4,1),hop 1s .6s infinite}
@keyframes hop{50%{transform:translateY(-18px) rotate(-4deg)}}
.big svg{display:block;margin:0 auto}
@keyframes pop{from{transform:scale(.1) translateY(80px);opacity:0}}
.party{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.party i{position:absolute;top:-20px;width:10px;height:16px;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.party b{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:46px;color:#fff;text-shadow:0 3px 12px #000;animation:pop .6s}
.cert{border:3px double var(--acc);border-radius:16px;padding:20px 14px;text-align:center;margin:18px 0}
/* ===== responsive: phone (default) / tablet / desktop ===== */
:root{--sh:190px;--sh2:240px;--gh:56px;--ob:46px;--ly:34px;--bgsz:110px;--bgs:150px;--wh:78px;--pw:420px;--gq:76px;--pv:150px}
.stage{height:var(--sh)}
.stage.tall{height:var(--sh2)}
.ground{height:var(--gh)}
.road{height:calc(var(--gh)*.4)}
.obj{bottom:calc(var(--gh) - 16px);font-size:var(--ob)}
.fl{font-size:var(--ob)}
#ei{font-size:calc(var(--ob)*1.15)}
#walker{bottom:calc(var(--gh) - 34px)}
#walker svg{height:var(--wh)}
.lay{font-size:var(--ly);padding-bottom:calc(var(--gh) - 20px)}
.big{font-size:var(--bgsz)}
.big svg{height:var(--bgs)}
.pop{max-width:var(--pw)}
.gq svg{height:var(--gq)}
#pv svg{height:var(--pv)}
.ov{align-items:flex-start}
.pop{margin:auto}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}.btn.ghost:hover{border-color:var(--acc)}.obj:hover,.fl:hover{filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}}
@media (max-width:420px){main{padding:18px 14px 60px}.card{padding:20px 16px}}
@media (min-width:640px){
:root{--sh:260px;--sh2:320px;--gh:72px;--ob:60px;--ly:46px;--bgsz:140px;--bgs:190px;--wh:104px;--pw:520px;--gq:96px;--pv:190px}
body{font-size:18px}
main{max-width:720px;padding:36px 32px 80px}
.card{padding:34px 32px}
h1{font-size:28px}h2{font-size:23px}
.bub{font-size:19px}
.card>.btn,.card>.row,.card>input[type=text],#ac .btn{max-width:520px;margin-left:auto;margin-right:auto}
}
@media (min-width:1024px){
:root{--sh:340px;--sh2:400px;--gh:90px;--ob:72px;--ly:56px;--bgsz:160px;--bgs:230px;--wh:128px;--pw:680px;--gq:110px;--pv:220px}
body{font-size:19px}
main{max-width:900px;padding:44px 40px 90px}
.card{padding:44px}
h1{font-size:34px}h2{font-size:26px}
.bub{font-size:21px;padding:22px 26px}
}
@media (max-height:520px) and (orientation:landscape){
:root{--sh:150px;--sh2:190px;--gh:44px;--ob:38px;--ly:28px;--bgsz:70px;--bgs:96px;--wh:60px;--pw:520px}
main{padding:14px 22px 40px}
.bub{min-height:70px;margin-bottom:22px}
}
/* ===== fresh theme + goose guide ===== */
:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#2B2320;--mute:#7C6F66;--line:#FFE3C7;--acc:#F26B0F;--acc2:#FFA53D;--sky:#7FD0FF;--grass:#8ADB6A;--road:#CFC7BB;--bub:#FFF8EE}
body{background:radial-gradient(circle at 100% 0,#FFE2B8 0,rgba(255,226,184,0) 38%),radial-gradient(circle at 0 100%,#FFD2A6 0,rgba(255,210,166,0) 34%),#fff;background-attachment:fixed;min-height:100vh}
.card{border:0;box-shadow:0 12px 36px rgba(242,107,15,.18),0 2px 6px rgba(0,0,0,.05)}
.steps i{height:10px}
.steps i.on{background:linear-gradient(90deg,var(--acc2),var(--acc))}
.btn,.btn.on{background:linear-gradient(180deg,#FF8A2B,#F26B0F);box-shadow:0 4px 0 #C2530A;font-weight:600}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C2530A}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn[disabled]{box-shadow:none}
.stage{background:linear-gradient(#7FD0FF,#E3F6FF)}
.stage:before{content:"";position:absolute;top:12px;right:16px;width:32px;height:32px;border-radius:50%;background:#FFD23F;box-shadow:0 0 0 8px rgba(255,210,63,.35)}
.stage:after{content:"☁️";position:absolute;top:10px;left:10%;font-size:30px;pointer-events:none}
.ground{background:linear-gradient(#A6E884,#6CC94E)}
.road{background:#CFC7BB}
.bub2{position:relative;background:var(--bub);border:2px solid var(--acc);color:var(--ink)}
.bub2:before{content:"";position:absolute;left:-10px;top:22px;border:8px solid transparent;border-right-color:var(--acc);border-left:0}
.bar i{background:linear-gradient(90deg,var(--acc2),#FFD23F)}
.slw b{border-color:var(--acc2)}
input[type=range]{background:linear-gradient(90deg,#FFD23F,#FFA53D,#F26B0F)}
.cert{background:linear-gradient(#FFF8EE,var(--card))}
.ov{background:rgba(255,138,43,.55);backdrop-filter:blur(6px)}
.gq.walk>div:first-child{animation:walkin 1.5s ease-out both,waddle .3s ease-in-out 5}
.gq.walk .bub2{animation:fadein .4s 1.4s both}
@keyframes walkin{from{transform:translateX(-140px);opacity:0}15%{opacity:1}to{transform:none}}
@keyframes waddle{50%{rotate:7deg;translate:0 -6px}}
@keyframes fadein{from{opacity:0;transform:scale(.9)}}
.gw{position:relative;height:62px;margin:8px 0 0}
#gg{position:absolute;bottom:0;left:0;line-height:0;transition:left .2s linear}
#gg.mv{animation:waddle .25s infinite}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1410;--card:#2A1F18;--ink:#FFF3E8;--mute:#C8B3A2;--line:#523823;--sky:#1F4E7A;--grass:#3E8F4A;--road:#5A5248;--bub:#3A2A1E}
body{background:var(--bg)}.stage{background:linear-gradient(#1F4E7A,#3B7BB0)}.ground{background:linear-gradient(#4CA65A,#2E7A3E)}}
#gt{white-space:pre-line}
#pv{background:radial-gradient(circle at 50% 42%,rgba(255,165,61,.4),transparent 62%)}
/* ===== fit to screen height ===== */
:root{--sh:clamp(150px,30vh,300px);--sh2:clamp(190px,36vh,360px);--gh:clamp(44px,8vh,84px);--ob:clamp(38px,min(7vh,10vw),70px);--ly:clamp(26px,min(5vh,8vw),52px);--wh:clamp(56px,min(11vh,17vw),124px);--bgsz:clamp(70px,16vh,150px);--bgs:clamp(96px,22vh,210px);--gq:clamp(56px,9vh,100px);--pv:clamp(110px,22vh,210px)}
main{padding:clamp(12px,3vh,40px) clamp(14px,4vw,40px) 80px}
.card{padding:clamp(16px,3vh,40px) clamp(16px,3vw,40px)}
p{margin-bottom:clamp(10px,2vh,20px)}
.meter{display:inline-block;width:32%;vertical-align:top;margin:8px 0;font-size:14px}
.card>.btn.c:not(.ghost):last-child{position:sticky;bottom:12px;z-index:5;box-shadow:0 4px 0 #C2530A,0 10px 24px rgba(0,0,0,.18)}
@media (max-height:760px){body{line-height:1.7}.btn{padding:10px 16px;margin-top:10px}.bub{min-height:90px;padding:12px 16px;margin-bottom:22px}h1{font-size:22px}h2{font-size:19px}}
.stage{background:linear-gradient(#7FD0FF,#E3F6FF)}.ground{background:linear-gradient(#A6E884,#6CC94E)}
#pv{background:radial-gradient(circle at 50% 45%,#FFF3E0 0,#FFE0BC 46%,transparent 68%)}
.cert{background:linear-gradient(#FFF8EE,#FFE9D0);color:#2A2522}.cert .mute{color:#7C6F66}
.pill{display:inline-block;background:linear-gradient(180deg,#FF8A2B,#F26B0F);color:#fff;font-weight:600;font-size:14px;border-radius:99px;padding:2px 14px;margin-bottom:8px}.hero{text-align:center}.gh{animation:hop 1s infinite}
#ei.glow:after{content:attr(data-tap);display:block;margin:2px auto 0;width:max-content;font-size:13px;font-weight:700;line-height:1.6;color:#fff;background:var(--acc);border-radius:99px;padding:0 10px}
#cin{position:fixed;inset:0;z-index:300;overflow:hidden;transition:opacity .5s}
#cin.out{opacity:0}
#cur{position:absolute;left:0;right:0;top:-70px;bottom:-60px;background:repeating-linear-gradient(90deg,#F26B0F 0 34px,#E4590A 34px 52px,#F58A2E 52px 74px,#E4590A 74px 90px);box-shadow:inset 0 -30px 40px rgba(120,40,0,.25)}
#cur:before{content:"";position:absolute;left:0;right:0;top:-24px;height:24px;background:radial-gradient(circle at 20px 24px,#F26B0F 0 19px,transparent 20px) 0 0/40px 24px repeat-x}
.ct{position:absolute;left:0;right:0;top:calc(70px + 18%);text-align:center;color:#fff;padding:0 18px;text-shadow:0 3px 10px rgba(120,40,0,.55)}
.ct b{display:block;font-size:clamp(26px,6vw,46px);line-height:1.4}
.ct span{display:inline-block;margin-top:8px;background:#fff;color:#C2530A;border-radius:99px;padding:0 14px;font-size:14px;font-weight:600;text-shadow:none}
.rope{position:absolute;left:calc(50% + 68px);width:4px;top:62%;bottom:248px;background:#E8B93C}
.ring{position:absolute;left:calc(50% + 56px);bottom:218px;width:28px;height:28px;border:5px solid #E8B93C;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.3)}
#cgs{position:absolute;left:50%;bottom:24px;width:190px;margin-left:-95px;height:190px;transform-origin:50% 100%;pointer-events:none}
#cgw{line-height:0}#cgw svg{display:block}
#cgw.walk{animation:waddle .28s ease-in-out infinite}
#cgw.strain{animation:strain .09s linear infinite}
@keyframes strain{25%{translate:-3px 0}75%{translate:3px 0}}
#cbub{position:absolute;left:50%;bottom:256px;transform:translateX(-50%);width:max-content;max-width:min(86vw,330px);background:#fff;color:#2A2522;border:3px solid #2A2522;border-radius:20px;padding:6px 16px;text-align:center;font-weight:700;font-size:18px;line-height:1.5;opacity:0;pointer-events:none}
#cbub small{display:block;font-size:14px;font-weight:400;color:#7C6F66}
#cbub:after{content:"";position:absolute;bottom:-14px;left:calc(50% + 26px);margin-left:-10px;border:10px solid transparent;border-top-color:#2A2522;border-bottom:0}
#cbub.on{opacity:1;animation:pop .35s}
#cskip{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;font:inherit;font-weight:600;font-size:14px;line-height:1.6;color:#C2530A;background:rgba(255,255,255,.92);border:0;border-radius:99px;padding:2px 16px;cursor:pointer;z-index:5}
.ov .btn.ghost{background:#fff;color:#2A2522}
.gh{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--gh) - 24px);line-height:0}
.gh svg{height:clamp(56px,11vh,100px);width:auto}
.sb{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:12px;width:max-content;max-width:min(340px,88vw);background:var(--bub,#FFF8EE);color:var(--ink);border:2px solid var(--acc);border-radius:16px;padding:2px 12px;font-size:14px;font-weight:600;line-height:1.6;text-align:center}
.sb:after{content:"";position:absolute;top:100%;left:calc(50% + 12px);margin-left:-8px;border:8px solid transparent;border-top-color:var(--acc);border-bottom:0}
/* ===== v5: faded street, cards, network, certificate ===== */
.xb{font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--acc);margin-bottom:6px}
.stage.gs{background:none}
.stage.gs .world{position:absolute;inset:0;background:linear-gradient(#7FD0FF,#E3F6FF);filter:sepia(calc(var(--gs,1)*.55)) saturate(calc(1 - var(--gs,1)*.75)) brightness(calc(1 + var(--gs,1)*.08));transition:filter .9s}
.stage.gs:before,.stage.gs:after{filter:sepia(calc(var(--gs,1)*.55)) saturate(calc(1 - var(--gs,1)*.75)) brightness(calc(1 + var(--gs,1)*.08));transition:filter .9s;z-index:1}
.stage.gs .obj,.stage.gs #walker{z-index:2}
.obj.gr{filter:sepia(.55) saturate(.25) brightness(1.08);transition:filter .6s}
.stage.gs .obj.done{opacity:1;filter:drop-shadow(0 0 8px #FFC24D)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
.bc{border:2px dashed var(--line);border-radius:14px;padding:6px 2px;text-align:center;line-height:1.3;color:var(--mute);min-height:74px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--bg)}
.bc i{font-style:normal;font-size:26px;filter:sepia(.55) saturate(.25);opacity:.55}
.bc b{font-weight:600;font-size:12px}
.bc.on{border:2px solid var(--acc2);background:linear-gradient(#FFF8EE,#FFE9D0);color:#2A2522;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.bc.on i{filter:none;opacity:1}
.net{position:relative;height:clamp(300px,46vh,440px);border-radius:16px;margin:14px 0;background:radial-gradient(circle at 50% 50%,#FFF1DC,#FFE0BC);overflow:hidden}
.net .lines{position:absolute;inset:0;width:100%;height:100%}
.net line{stroke:#D9C3A8;stroke-width:3;stroke-dasharray:4 6;vector-effect:non-scaling-stroke;opacity:.8}
.net line.on{stroke:#F58A2E;stroke-dasharray:none;stroke-width:5;opacity:1;animation:lnx .8s}
.net line.rg{stroke:#F7B267;opacity:0;stroke-width:3;stroke-dasharray:2 7;transition:opacity 1.2s}
.net.all line.rg{opacity:1}
@keyframes lnx{from{stroke-width:1;opacity:.2}}
.nd{position:absolute;transform:translate(-50%,-50%);width:96px;background:none;border:0;padding:0;text-align:center;cursor:pointer;font:inherit;line-height:1.25}
.nd span{display:grid;place-items:center;width:64px;height:64px;margin:0 auto;border-radius:50%;background:#fff;border:3px solid #FFE3C7;font-size:34px;box-shadow:0 4px 12px rgba(0,0,0,.12);transition:.4s}
.nd small{display:block;margin-top:4px;font-size:12px;font-weight:600;color:#2A2522}
.nd:not(.tp):not(.on) span{animation:pulse2 1.4s infinite;border-color:#FFA53D}
.nd.on span{border-color:#F26B0F;background:#FFF1DC}
.nd.tp{left:50%;top:50%;width:120px}
.nd.tp span{width:92px;height:92px;font-size:52px}
.net.all .nd.tp span{box-shadow:0 0 0 10px rgba(255,194,77,.35),0 0 40px 10px rgba(255,194,77,.7);animation:glow 1.6s infinite}
@keyframes pulse2{50%{transform:scale(1.1)}}
@keyframes glow{50%{box-shadow:0 0 0 18px rgba(255,194,77,.25),0 0 56px 16px rgba(255,194,77,.8)}}
.chips{display:grid;gap:10px;margin:14px 0}
.chip{font:inherit;display:flex;align-items:center;gap:12px;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:10px 14px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chip span{font-size:26px}
.chip.on{border-color:var(--acc);background:#FFF1DC;color:#2A2522}
.cert2{position:relative;background:linear-gradient(#FFFDF8,#FFF1DC);color:#2A2522;border:4px double #E8B93C;border-radius:18px;padding:20px 16px 16px;text-align:center;box-shadow:0 10px 30px rgba(242,107,15,.25);overflow:hidden}
.cert2:before{content:"";position:absolute;inset:6px;border:2px solid #F58A2E;border-radius:12px;pointer-events:none}

24 18 18 22z" fill="${HR}"/><circle cx="25" cy="25" r="1.6" fill="#222"/><circle cx="35" cy="25" r="1.6" fill="#222"/><path d="M22.5 23.5l-1.2-.8M37.5 23.5l1.2-.8" stroke="#222" stroke-width=".8"/><circle cx="21.5" cy="29" r="2.2" fill="#F59E9E" opacity=".5"/><circle cx="38.5" cy="29" r="2.2" fill="#F59E9E" opacity=".5"/><g fill="none" stroke="#C0392B" stroke-width="1.3"><ellipse cx="25" cy="25" rx="4.2" ry="3.2"/><ellipse cx="35" cy="25" rx="4.2" ry="3.2"/><path d="M29.2 25h1.6"/></g>`}<path d="M27 30q3 2 6 0" stroke="#a0522d" fill="none" stroke-width="1"/></svg>`};

/* popup talk */
let T;
function show(w,text,acts){ov.style.display="flex";ov.innerHTML=`<div class="pop ${w.h?"gt":""}"><div class="bub"><b>${w.n}</b><div id="tx"></div></div><div class="big ${w.h?"hop":""}">${w.s}</div><div id="ac"></div></div>`;
 const tx=$("#tx"),ac=$("#ac"),a=[...text];let i=0,done=false;clearInterval(T);
 const fin=u=>{if(done)return;if(u===1)stat.skips++;done=true;clearInterval(T);tx.textContent=text;ac.innerHTML="";
  acts.forEach(([l,f])=>{const b=document.createElement("button");b.className="btn c";b.textContent=l;b.onclick=f;ac.appendChild(b)})};
 const sk=document.createElement("button");sk.className="btn c ghost";sk.textContent=L("⏩ Show full text","⏩ แสดงข้อความทั้งหมด");sk.onclick=()=>fin(1);ac.appendChild(sk);
 T=setInterval(()=>{tx.textContent+=a[i++]||"";if(i>=a.length)fin()},22);
 ov.querySelector(".bub").onclick=()=>fin(1)}
const hide=()=>{clearInterval(T);ov.style.display="none"};
function dlg(Ls,done,i=0){const last=i>=Ls.length-1;show(Ls[i][0],Ls[i][1],[[last?L("OK","ตกลง"):L("Next ▶","ถัดไป ▶"),()=>last?(hide(),done&&done()):dlg(Ls,done,i+1)]])}

 d.innerHTML=Array.from({length:70},()=>`<i style="left:${Math.random()*100}%;background:${c[Math.random()*5|0]};animation-delay:${Math.random()*.6}s;animation-duration:${1.5+Math.random()}s"></i>`).join("")+"<b>"+t+"</b>";
 document.body.appendChild(d);setTimeout(()=>d.remove(),2800)}

let curtainDone=false;
function playCurtain(){
 if(curtainDone)return;curtainDone=true;
 if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
 const el=document.createElement("div");el.id="cin";el.setAttribute("aria-hidden","true");
 el.innerHTML=`<div id="cur"><div class="ct"><b>The Beauty We Walked Past</b><span>GEN241 INTERACTIVE EXHIBITION</span><br><span>KMUTT · Group INT 38-01</span></div><i class="rope"></i><i class="ring"></i></div><div id="cbub"></div><div id="cgs"><div id="cgw" class="walk">${goose(190)}</div></div><button id="cskip">Skip ▶ · ข้าม</button>`;
 document.body.appendChild(el);
 const H=el.clientHeight,Yf=H-16,TT=9400,tm=[];
 const cur=$("#cur"),gs=$("#cgs"),gw=$("#cgw"),bub=$("#cbub");
 const end=()=>{tm.forEach(clearTimeout);el.remove()};
 $("#cskip").onclick=end;
 // curtain: [time, y, easing to next]
 const C=[[0,0,"linear"],[1600,0,"ease-in-out"],[2200,50,"linear"],[2260,48,"linear"],[2320,52,"linear"],[2380,49,"ease-in"],[2600,-8,"ease-out"],[2750,5,"ease-in-out"],[2900,0,"linear"],
  [3300,0,"ease-in-out"],[4000,85,"linear"],[4060,83,"linear"],[4120,88,"linear"],[4180,84,"ease-in"],[4250,86,"ease-in"],[4500,-10,"ease-out"],[4650,6,"ease-in-out"],[4800,0,"linear"],
  [5200,0,"ease-in-out"],[6100,125,"linear"],[6160,122,"linear"],[6220,128,"linear"],[6280,124,"ease-in"],[6600,Yf+30,"ease-out"],[6800,Yf-22,"ease-in-out"],[6950,Yf+8,"ease-in-out"],[7080,Yf-5,"ease-in-out"],[7200,Yf,"linear"],[TT,Yf,"linear"]];
 // goose: [time, x, y, scale, rotate, easing]
 const G=[[0,0,-.42*H,.2,0,"ease-out"],[400,-70,-.3*H,.38,0,"linear"],[800,60,-.17*H,.58,0,"linear"],[1200,-25,-.06*H,.85,0,"ease-out"],[1600,0,0,1,0,"ease-in-out"],[1700,0,6,1,3,"ease-in-out"],
  [2200,0,45,.97,10,"linear"],[2380,0,47,.97,11,"ease-in"],[2480,0,-18,1.02,-8,"ease-out"],[2700,0,6,1,2,"ease-in-out"],[2900,0,0,1,0,"ease-in-out"],
  [3300,0,0,1,3,"ease-in-out"],[4000,0,77,.95,12,"linear"],[4250,0,79,.95,13,"ease-in"],[4400,0,-24,1.03,-10,"ease-out"],[4650,0,8,1,3,"ease-in-out"],[4800,0,0,1,0,"ease-in-out"],
  [5200,0,0,1,3,"ease-in-out"],[6100,0,112,.92,14,"linear"],[6280,0,115,.92,15,"ease-in"],[6450,0,-35,1.05,-18,"ease-out"],[6700,0,10,1,6,"ease-in-out"],[7000,0,-6,1.02,-3,"ease-in-out"],[7200,0,0,1,0,"ease-in-out"],[TT,0,0,1,0,"linear"]];
 const o={duration:TT,fill:"forwards"};
 cur.animate(C.map(k=>({transform:`translateY(${k[1]}px)`,offset:k[0]/TT,easing:k[2]})),o);
 gs.animate(G.map(k=>({transform:`translate(${k[1]}px,${k[2]}px) rotate(${k[4]}deg) scale(${k[3]})`,offset:k[0]/TT,easing:k[5]})),o);

 const say=(en,th)=>{bub.innerHTML=en+"<small>"+th+"</small>";bub.className="";void bub.offsetWidth;bub.className="on"};
 const strain=on=>gw.className=on?"strain":"";
 at(1500,()=>strain(0));
 [[700,"Honk honk! Curtain time!","ก๊าบ ก๊าบ! ได้เวลาเปิดม่าน!"],[1750,"Hnnngh… ah, it’s heavy!","อึ๊บบ… โอ๊ย หนักจัง!"],[2480,"WAH! It bounced back!","ว้าย! ม่านเด้งกลับ!"],
  [3350,"Again… hnnnngh!","อีกที… อึ๊บบบ!"],[4400,"Don’t you dare… stay down!","อย่าเด้งกลับนะ… อยู่ข้างล่างนะ!"],[5300,"Almost… I’m not giving up!","ใกล้แล้ว… ไม่ยอมแพ้หรอก!"],
  [6400,"HONK!!","ก๊าบบบ!!"],[7300,"Finally… it’s down! 😮‍💨","ในที่สุดก็ลงมาแล้ว!"],[8300,"Welcome to Wat Phuttha Bucha!","ยินดีต้อนรับสู่วัดพุทธบูชา!"]].forEach(([t,e,h])=>at(t,()=>say(e,h)));

/* start: language -> goose -> name */
function pick(){prog(0);resetStat();box.innerHTML=`<div class="hero"><div class="xb">GEN241 INTERACTIVE EXHIBITION</div><span class="pill">🎓 KMUTT · Group INT 38-01</span><h1>The Beauty We Walked Past</h1><p>Exploring Human Beauty at Wat Phuttha Bucha community<br><span class="mute">สำรวจความงามของมนุษย์ ณ ชุมชนวัดพุทธบูชา</span></p></div><div class="stage"><div class="ground"></div><div class="road"></div><div class="obj" style="left:12%">🌴</div><div class="obj" style="left:28%">🛕</div><div class="obj" style="left:72%">🥥</div><div class="obj" style="left:88%">🍜</div><div class="gh">${goose(100)}<div class="sb">Honk! Choose your language · เลือกภาษา</div></div></div>`;
 btn("English",()=>{lang="en";hello()},"c");btn("ไทย",()=>{lang="th";hello()},"c");playCurtain()}
function hello(){dlg([[G(),L("Honk honk! Let’s go on fieldwork at Wat Phuttha Bucha in Bang Mot!","ก๊าบ ก๊าบ! ไปลงพื้นที่ที่วัดพุทธบูชา บางมด กันเถอะ!")],[G(),L("I’m the KMUTT goose. You’re a KMUTT student, and today you’ll meet the people here and find the beauty we usually walk past.","เราคือห่านประจำ มจธ. วันนี้เธอเป็นนักศึกษา มจธ. จะได้พบผู้คนที่นี่ และค้นหาความงามที่เรามักเดินผ่านโดยไม่ทันสังเกต")]],intro)}
function intro(){prog(0);
 box.innerHTML=`<h1>${L("Who is exploring today?","วันนี้ใครมาลงพื้นที่?")}</h1><div style="text-align:center" id="pv">${pl(150)}</div><div class="row"><button class="btn ghost c ${me.g=="m"?"on":""}" data-g="m">${L("Mr","นาย")}</button><button class="btn ghost c ${me.g=="f"?"on":""}" data-g="f">${L("Ms","นางสาว")}</button></div><input type="text" id="nm" placeholder="${L("Your first name","ชื่อของเธอ")}" maxlength="14" value="${esc(me.n)}">`;
