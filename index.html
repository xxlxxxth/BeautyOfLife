<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Beauty We Walked Past</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{/* change --acc / --acc2 here to the official KMUTT orange */--bg:#FFFFFF;--card:#FFFFFF;--ink:#2A2522;--mute:#8A7B70;--line:#FFD9BF;--acc:#D95F0E;--acc2:#F58A2E;--bad:#B4533A;--sky:#FFF1E3;--grass:#F9D3A8;--road:#E8B98A;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1511;--card:#251D17;--ink:#F6EBE2;--mute:#B79F8C;--line:#4A3626;--acc:#FF8A3D;--acc2:#FFB067;--sky:#3A2A1E;--grass:#5A4128;--road:#6F5236}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:'Noto Sans Thai',system-ui,sans-serif;line-height:2;letter-spacing:.02em;font-size:17px}
main{max-width:520px;margin:0 auto;padding:26px 22px 70px}
.steps{display:flex;gap:8px;margin-bottom:26px}
.steps i{flex:1;height:8px;border-radius:8px;background:var(--line)}
.steps i.on{background:var(--acc2)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:26px 22px}
h1{font-size:24px;line-height:1.6;margin:0 0 14px}
h2{font-size:20px;line-height:1.6;margin:0 0 10px}
p{margin:0 0 20px}
.mute{color:var(--mute);font-size:15px}
.stage{position:relative;height:190px;border-radius:16px;overflow:hidden;background:var(--sky);margin:18px 0}
.ground{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--grass)}
.road{position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--road)}
.obj{position:absolute;bottom:40px;font-size:46px;line-height:1;cursor:pointer;transform:translateX(-50%)}
.obj.done{opacity:.5}
.glow{animation:pulse 1.4s infinite}
@keyframes pulse{50%{transform:translateX(-50%) scale(1.2)}}
#walker{position:absolute;bottom:22px;left:6%;transition:left .65s ease;transform:translateX(-50%);line-height:0}
.btn{display:block;width:100%;font:inherit;line-height:1.8;color:#fff;background:var(--acc);border:0;border-radius:14px;padding:14px 18px;cursor:pointer;margin-top:14px;text-align:left}
.btn.c{text-align:center;font-weight:600}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
.btn.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn[disabled]{opacity:.4;cursor:default}
.row{display:flex;gap:10px}
input[type=text]{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:14px}
.lay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:space-around;padding-bottom:36px;font-size:34px;pointer-events:none}
.slw{display:flex;align-items:center;gap:10px;margin:10px 0 6px}
.slw b{font-size:24px;cursor:pointer;background:var(--bg);border:2px solid var(--line);border-radius:12px;width:46px;height:46px;display:grid;place-items:center;user-select:none}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:18px;border-radius:18px;background:linear-gradient(90deg,#FFC48A,var(--acc));outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:46px;height:46px;border-radius:50%;background:#fff;border:5px solid var(--acc);box-shadow:0 3px 10px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;border:5px solid var(--acc)}
.hint{text-align:center;font-weight:600;color:var(--acc);animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:translateX(8px)}}
.hint.off{display:none}
.era{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}
.meter{margin:12px 0;font-size:15px}
.bar{height:10px;background:var(--line);border-radius:10px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:50%;background:var(--acc2);transition:width .6s}
.gq{display:flex;gap:12px;align-items:center;margin:14px 0}
.bub2{flex:1;background:var(--sky);border:2px solid var(--ink);border-radius:18px;padding:10px 14px;line-height:1.7;min-height:72px}
.big2{font-size:56px;line-height:1}
.fl{position:absolute;font-size:46px;cursor:pointer;animation:fl 3s ease-in-out infinite alternate}
@keyframes fl{to{transform:translateY(-14px)}}
.fl.no{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
.ov{position:fixed;inset:0;background:rgba(30,16,6,.8);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;overflow:auto}
.pop{width:100%;max-width:420px;text-align:center}
.bub{position:relative;background:#fff;color:#2A2522;border:3px solid #2A2522;border-radius:24px;padding:16px 20px;text-align:left;margin-bottom:26px;min-height:120px;animation:pop .35s}
.bub:after{content:"";position:absolute;bottom:-17px;left:50%;margin-left:-14px;border:14px solid transparent;border-top-color:#2A2522;border-bottom:0}
.bub b{color:#D95F0E;display:block;font-size:15px}
.bub div{white-space:pre-line}
.big{font-size:110px;line-height:1.1;animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.big.hop{animation:pop .6s cubic-bezier(.2,1.6,.4,1),hop 1s .6s infinite}
@keyframes hop{50%{transform:translateY(-18px) rotate(-4deg)}}
.big svg{display:block;margin:0 auto}
@keyframes pop{from{transform:scale(.1) translateY(80px);opacity:0}}
.party{position:fixed;inset:0;pointer-events:none;z-index:99;overflow:hidden}
.party i{position:absolute;top:-20px;width:10px;height:16px;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.party b{position:absolute;top:38%;left:0;right:0;text-align:center;font-size:46px;color:#fff;text-shadow:0 3px 12px #000;animation:pop .6s}
.cert{border:3px double var(--acc);border-radius:16px;padding:20px 14px;text-align:center;margin:18px 0}
/* ===== responsive: phone (default) / tablet / desktop ===== */
:root{--sh:190px;--sh2:240px;--gh:56px;--ob:46px;--ly:34px;--bgsz:110px;--bgs:150px;--wh:78px;--pw:420px;--gq:76px;--pv:150px}
.stage{height:var(--sh)}
.stage.tall{height:var(--sh2)}
.ground{height:var(--gh)}
.road{height:calc(var(--gh)*.4)}
.obj{bottom:calc(var(--gh) - 16px);font-size:var(--ob)}
.fl{font-size:var(--ob)}
#ei{font-size:calc(var(--ob)*1.15)}
#walker{bottom:calc(var(--gh) - 34px)}
#walker svg{height:var(--wh)}
.lay{font-size:var(--ly);padding-bottom:calc(var(--gh) - 20px)}
.big{font-size:var(--bgsz)}
.big svg{height:var(--bgs)}
.pop{max-width:var(--pw)}
.gq svg{height:var(--gq)}
#pv svg{height:var(--pv)}
.ov{align-items:flex-start}
.pop{margin:auto}
@media (hover:hover){.btn:hover{filter:brightness(1.08)}.btn.ghost:hover{border-color:var(--acc)}.obj:hover,.fl:hover{filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}}
@media (max-width:420px){main{padding:18px 14px 60px}.card{padding:20px 16px}}
@media (min-width:640px){
:root{--sh:260px;--sh2:320px;--gh:72px;--ob:60px;--ly:46px;--bgsz:140px;--bgs:190px;--wh:104px;--pw:520px;--gq:96px;--pv:190px}
body{font-size:18px}
main{max-width:720px;padding:36px 32px 80px}
.card{padding:34px 32px}
h1{font-size:28px}h2{font-size:23px}
.bub{font-size:19px}
.card>.btn,.card>.row,.card>input[type=text],#ac .btn{max-width:520px;margin-left:auto;margin-right:auto}
}
@media (min-width:1024px){
:root{--sh:340px;--sh2:400px;--gh:90px;--ob:72px;--ly:56px;--bgsz:160px;--bgs:230px;--wh:128px;--pw:680px;--gq:110px;--pv:220px}
body{font-size:19px}
main{max-width:900px;padding:44px 40px 90px}
.card{padding:44px}
h1{font-size:34px}h2{font-size:26px}
.bub{font-size:21px;padding:22px 26px}
}
@media (max-height:520px) and (orientation:landscape){
:root{--sh:150px;--sh2:190px;--gh:44px;--ob:38px;--ly:28px;--bgsz:70px;--bgs:96px;--wh:60px;--pw:520px}
main{padding:14px 22px 40px}
.bub{min-height:70px;margin-bottom:22px}
}
/* ===== fresh theme + goose guide ===== */
:root{--bg:#FFFFFF;--card:#FFFFFF;--ink:#2B2320;--mute:#7C6F66;--line:#FFE3C7;--acc:#F26B0F;--acc2:#FFA53D;--sky:#7FD0FF;--grass:#8ADB6A;--road:#CFC7BB;--bub:#FFF8EE}
body{background:radial-gradient(circle at 100% 0,#FFE2B8 0,rgba(255,226,184,0) 38%),radial-gradient(circle at 0 100%,#FFD2A6 0,rgba(255,210,166,0) 34%),#fff;background-attachment:fixed;min-height:100vh}
.card{border:0;box-shadow:0 12px 36px rgba(242,107,15,.18),0 2px 6px rgba(0,0,0,.05)}
.steps i{height:10px}
.steps i.on{background:linear-gradient(90deg,var(--acc2),var(--acc))}
.btn,.btn.on{background:linear-gradient(180deg,#FF8A2B,#F26B0F);box-shadow:0 4px 0 #C2530A;font-weight:600}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C2530A}
.btn.ghost{background:var(--bg);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 var(--line)}
.btn[disabled]{box-shadow:none}
.stage{background:linear-gradient(#7FD0FF,#E3F6FF)}
.stage:before{content:"";position:absolute;top:12px;right:16px;width:32px;height:32px;border-radius:50%;background:#FFD23F;box-shadow:0 0 0 8px rgba(255,210,63,.35)}
.stage:after{content:"☁️";position:absolute;top:10px;left:10%;font-size:30px;pointer-events:none}
.ground{background:linear-gradient(#A6E884,#6CC94E)}
.road{background:#CFC7BB}
.bub2{position:relative;background:var(--bub);border:2px solid var(--acc);color:var(--ink)}
.bub2:before{content:"";position:absolute;left:-10px;top:22px;border:8px solid transparent;border-right-color:var(--acc);border-left:0}
.bar i{background:linear-gradient(90deg,var(--acc2),#FFD23F)}
.slw b{border-color:var(--acc2)}
input[type=range]{background:linear-gradient(90deg,#FFD23F,#FFA53D,#F26B0F)}
.cert{background:linear-gradient(#FFF8EE,var(--card))}
.ov{background:rgba(255,138,43,.55);backdrop-filter:blur(6px)}
.gq.walk>div:first-child{animation:walkin 1.5s ease-out both,waddle .3s ease-in-out 5}
.gq.walk .bub2{animation:fadein .4s 1.4s both}
@keyframes walkin{from{transform:translateX(-140px);opacity:0}15%{opacity:1}to{transform:none}}
@keyframes waddle{50%{rotate:7deg;translate:0 -6px}}
@keyframes fadein{from{opacity:0;transform:scale(.9)}}
.gw{position:relative;height:62px;margin:8px 0 0}
#gg{position:absolute;bottom:0;left:0;line-height:0;transition:left .2s linear}
#gg.mv{animation:waddle .25s infinite}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1410;--card:#2A1F18;--ink:#FFF3E8;--mute:#C8B3A2;--line:#523823;--sky:#1F4E7A;--grass:#3E8F4A;--road:#5A5248;--bub:#3A2A1E}
body{background:var(--bg)}.stage{background:linear-gradient(#1F4E7A,#3B7BB0)}.ground{background:linear-gradient(#4CA65A,#2E7A3E)}}
#gt{white-space:pre-line}
#pv{background:radial-gradient(circle at 50% 42%,rgba(255,165,61,.4),transparent 62%)}
/* ===== fit to screen height ===== */
:root{--sh:clamp(150px,30vh,300px);--sh2:clamp(190px,36vh,360px);--gh:clamp(44px,8vh,84px);--ob:clamp(38px,min(7vh,10vw),70px);--ly:clamp(26px,min(5vh,8vw),52px);--wh:clamp(56px,min(11vh,17vw),124px);--bgsz:clamp(70px,16vh,150px);--bgs:clamp(96px,22vh,210px);--gq:clamp(56px,9vh,100px);--pv:clamp(110px,22vh,210px)}
main{padding:clamp(12px,3vh,40px) clamp(14px,4vw,40px) 80px}
.card{padding:clamp(16px,3vh,40px) clamp(16px,3vw,40px)}
p{margin-bottom:clamp(10px,2vh,20px)}
.meter{display:inline-block;width:32%;vertical-align:top;margin:8px 0;font-size:14px}
.card>.btn.c:not(.ghost):last-child{position:sticky;bottom:12px;z-index:5;box-shadow:0 4px 0 #C2530A,0 10px 24px rgba(0,0,0,.18)}
@media (max-height:760px){body{line-height:1.7}.btn{padding:10px 16px;margin-top:10px}.bub{min-height:90px;padding:12px 16px;margin-bottom:22px}h1{font-size:22px}h2{font-size:19px}}
.stage{background:linear-gradient(#7FD0FF,#E3F6FF)}.ground{background:linear-gradient(#A6E884,#6CC94E)}
#pv{background:radial-gradient(circle at 50% 45%,#FFF3E0 0,#FFE0BC 46%,transparent 68%)}
.cert{background:linear-gradient(#FFF8EE,#FFE9D0);color:#2A2522}.cert .mute{color:#7C6F66}
</style>
